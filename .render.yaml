services:
  - type: web
    name: campusmaster-backend
    env: docker
    region: oregon  # Changer selon ta région
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/*.jar
    dockerfilePath: Backend/Dockerfile
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
        scope: run
      - key: PORT
        value: 10000
        scope: run
      - key: DATABASE_URL
        scope: run
      - key: DB_USERNAME
        scope: run
      - key: DB_PASSWORD
        scope: run
      - key: JWT_SECRET
        scope: run
      - key: JWT_EXPIRATION
        value: "604800000"
        scope: run
      - key: FILE_UPLOAD_DIR
        value: /tmp/uploads
        scope: run
