version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campusmaster-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusmaster_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: campusmaster
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campusmaster-network

volumes:
  postgres_data:
    driver: local

networks:
  campusmaster-network:
    driver: bridge
