spring.application.name=campusmaster

spring.datasource.url=jdbc:postgresql://localhost:5432/campusmaster_db
spring.datasource.username=postgres
spring.datasource.password=campusmaster
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

jwt.secret=${JWT_SECRET:campusmaster2026SecretKeyForJWTTokenGenerationAndValidation}
jwt.expiration=${JWT_EXPIRATION:604800000}

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

file.upload-dir=/app/uploads

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Profil actif - déterminé par SPRING_PROFILES_ACTIVE env var (dev par défaut)
